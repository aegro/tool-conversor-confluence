# Default configuration for HTML processor
input_directory: 'io/VEN'
output_directory: 'io'
create_docx: false
log_level: 'INFO'
log_file: 'html_processor.log'

# HTML cleaning settings
standard_html_classes:
  table: ['sortable']
  td: ['selected', 'header']
  tr: ['odd', 'even']
  div: ['container', 'row', 'column']
  span: ['bold', 'italic', 'underline']
  ul: ['list', 'navigation']
  li: ['active', 'current']
  img: ['thumbnail', 'responsive']
  a: ['active', 'visited', 'external']

image_settings:
  border_color: '#00c65e'
  border_width: '1px'
  allowed_attrs: ['src', 'alt', 'width', 'height', 'title', 'style']

# Filename processing settings
filename_settings:
  preserve_spaces: true    # If true, spaces in filenames will be preserved; if false, spaces will be converted to hyphens
  replace_character: '-'   # Character to use when replacing spaces (if preserve_spaces is false)
  sanitize_characters: true  # Remove special characters from filenames for better compatibility
  url_safe_filenames: true   # Ensure filenames are URL-safe by removing problematic characters

http_settings:
  timeout: 30
  max_retries: 3
  user_agent: 'HTML Processor Bot/1.0'

# Add this to your existing config
document_tree:
  format: 'table'  # or 'tree' for the original format
  separator: ';'  # separator between columns
  show_filenames: false  # Set to false to hide filenames